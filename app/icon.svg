<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background: rounded square, mismo estilo que el brand (primary/15 + primary/25 border) -->
  <rect width="32" height="32" rx="7" fill="hsl(186 78% 43% / 0.15)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="hsl(186 78% 43% / 0.35)"/>

  <!-- Lucide Calendar icon, centrado, color primary -->
  <!-- Stroke width 2, scaled to fit ~20px in a 32px canvas, centered at 16,16 -->
  <g transform="translate(6, 6)" stroke="hsl(186, 78%, 43%)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cuerpo del calendario -->
    <rect x="1" y="2" width="18" height="18" rx="2"/>
    <!-- Argollas -->
    <line x1="6" y1="0" x2="6" y2="4"/>
    <line x1="14" y1="0" x2="14" y2="4"/>
    <!-- Línea separadora de cabecera -->
    <line x1="1" y1="8" x2="19" y2="8"/>
  </g>
</svg>
